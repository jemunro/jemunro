project:
  type: website
  # Render only .qmd pages (README.md/CLAUDE.md/PLAN.md are repository docs, not site pages).
  render:
    - "*.qmd"

metadata-files:
  - _variables.yml

website: {}

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles.scss]
    page-layout: custom
    title-block-style: none
    toc: false
    lang: en

